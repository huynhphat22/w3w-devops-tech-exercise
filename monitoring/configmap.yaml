apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

  alerts.yml: |
    groups:
      - name: greeter-slo-alerts
        rules:
          - alert: GreeterHighHttp5xxErrorRate
            # Evaluates error ratio against 99.9% Availability SLO (100x fast burn rate)
            expr: |
              (
                sum by (namespace) (rate(greeter_http_requests_total{status=~"5.."}[1m]))
                /
                sum by (namespace) (rate(greeter_http_requests_total[1m]))
              ) * 100 > 10
            for: 30s
            labels:
              severity: critical
              slo: "99.9-availability"
              burn_rate: "100x"
            annotations:
              summary: "High HTTP 5xx error rate in namespace {{ $labels.namespace }}"
              description: "Namespace {{ $labels.namespace }} is experiencing an HTTP 5xx error rate of {{ $value | printf \"%.2f\" }}% (>10%, 100x SLO burn rate)."
              runbook_url: "https://runbooks.internal/greeter/slo-burn-5xx"
